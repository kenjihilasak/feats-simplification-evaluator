services:
  phase4a:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PHASE4A_DATABASE: /data/gold_review.sqlite3
      PHASE4A_COOKIE_SECURE: "0"
      PORT: "8000"
    volumes:
      - ./runtime/docker:/data
    restart: unless-stopped
